# Working-memory scratchpad under sway (archsway): the sway equivalent of
# hypr/working-memory.lua. install.sh symlinks this into
# ~/.config/sway/config.d/, which the main sway config includes.
#
# A plain floating window, centered and sized on first appearance, like the
# Hyprland rule. archsway's Super+C/V treat it as a normal (non-terminal)
# window, so they send literal Ctrl+C/Ctrl+V.
for_window [app_id="^omarchy-working-memory$"] floating enable, resize set 900 640, move position center

bindsym $mod+n exec omarchy-working-memory-toggle
