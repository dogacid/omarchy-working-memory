# Dedicated foot config for the working-memory scratchpad only (passed via
# `foot --config=`, not foot's normal ~/.config/foot/foot.ini).
#
# Omarchy's Super+V/Super+C send Shift+Insert/Ctrl+Insert to focused
# terminal windows (bindings/clipboard.lua in the omarchy package). Those
# are handled here, by foot itself, rather than forwarded to the app:
# Bubble Tea's key decoder (charmbracelet/bubbletea@v1.3.10, key.go) has no
# table entry for either combo, so the app could never actually recognize
# them no matter how it's coded. foot's own clipboard-copy/clipboard-paste
# actions talk to the real Wayland clipboard directly, and clipboard-copy
# naturally copies whatever text is actually selected — which is also just
# more correct than an app-level "copy the whole buffer" bind would be.
#
# primary-paste (Shift+Insert by default) is turned off so it doesn't
# shadow the clipboard-paste binding added below.
[key-bindings]
primary-paste=none
clipboard-copy=Control+Shift+c XF86Copy Control+Insert
clipboard-paste=Control+Shift+v XF86Paste Shift+Insert
