# Dedicated foot config for the working-memory scratchpad only (passed via
# `foot --config=`, not foot's normal ~/.config/foot/foot.ini).
#
# foot binds Shift+Insert to its own "primary-paste" by default, which would
# swallow the key before the app ever sees it — Omarchy's Super+V sends
# exactly that combo to focused terminal windows (see bindings/clipboard.lua
# in the omarchy package), and the app needs to handle it itself so paste
# goes through the real clipboard (wl-paste), not the X11-style primary
# selection buffer. Ctrl+Insert (what Super+C sends) has no foot default, so
# it already passes through untouched.
[key-bindings]
primary-paste=none
